# Fixable findings in bundled tools and pinned images whose latest release
# still carries them.
# Each entry expires, so the image audit fails again and the tool gets checked
# for a new release.
vulnerabilities:
  - id: CVE-2026-111943
    paths:
      - usr/local/bin/railpack
    statement: Railpack 0.42.0 is built with Go 1.26.9; the fix needs Go 1.26.10.
    expired_at: 2026-11-27
  - id: CVE-2026-78669
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
      - usr/libexec/docker/cli-plugins/docker-compose
    statement: buildx 0.38.1 and compose 5.6.1, the latest releases, use golang.org/x/net below 0.60.0.
    expired_at: 2026-11-27
  - id: CVE-2026-17106
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
    statement: buildx 0.38.1, the latest release, uses moby/go-archive 0.2.0.
    expired_at: 2026-11-27
  - id: CVE-2026-105769
    paths:
      - usr/local/bin/pack
    statement: pack 0.40.10, the latest release, uses chainguard-dev/kaniko 1.25.16; the fix is in 1.25.20.
    expired_at: 2026-11-27
  - id: CVE-2026-78661
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
      - usr/libexec/docker/cli-plugins/docker-compose
      - usr/local/bin/pack
      - usr/local/bin/railpack
    statement: The fix is golang.org/x/net 0.62.0. buildx 0.38.2, compose 5.7.0, pack 0.40.10 and Railpack 0.43.0, the latest releases, use older versions.
    expired_at: 2026-11-27
