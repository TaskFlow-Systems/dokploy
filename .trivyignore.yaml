# Fixable findings in bundled tools and pinned images whose latest release
# still carries them.
# Each entry expires, so the image audit fails again and the tool gets checked
# for a new release.
vulnerabilities:
  - id: CVE-2026-111943
    paths:
      - usr/local/bin/railpack
    statement: Railpack 0.43.0, the latest release (rechecked 2026-11-16), is built with Go 1.26.9; the fix needs Go 1.26.10.
    expired_at: 2026-12-04
  - id: CVE-2026-17106
    paths:
      - usr/libexec/docker/cli-plugins/docker-buildx
    statement: buildx 0.39.0, the latest release (rechecked 2026-11-16), and its main branch still use moby/go-archive 0.2.0; the fix is in 0.3.0.
    expired_at: 2026-12-04
  - id: CVE-2026-78661
    paths:
      - usr/libexec/docker/cli-plugins/docker-compose
      - usr/local/bin/pack
      - usr/local/bin/railpack
    statement: The fix is golang.org/x/net 0.62.0. Rechecked 2026-11-16 on the latest releases, compose 5.7.1 uses 0.60.0 (its main branch too), pack 0.40.11 uses 0.60.0 (main has 0.62.0, not released yet) and Railpack 0.43.0 uses 0.61.0. buildx 0.39.0 has the fix.
    expired_at: 2026-12-04
  - id: CVE-2026-76844
    purls:
      - pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1
    statement: postgres 18.7, the latest official image, ships zlib1g 1:1.3.dfsg+really1.3.1-1+b1, and so does its rebuild of 2026-11-12 (rechecked 2026-11-16, no 18.8 yet); Debian's fix 1-1+deb13u1 (DSA-6613-1) waits for their next rebuild. Images built here take it through apt-get upgrade, so the entry matches only the old version.
    expired_at: 2026-11-20
  - id: CVE-2026-85091
    purls:
      - pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1
    statement: postgres 18.7, the latest official image, ships zlib1g 1:1.3.dfsg+really1.3.1-1+b1, and so does its rebuild of 2026-11-12 (rechecked 2026-11-16, no 18.8 yet); Debian's fix 1-1+deb13u1 (DSA-6613-1) waits for their next rebuild. Images built here take it through apt-get upgrade, so the entry matches only the old version.
    expired_at: 2026-11-20
