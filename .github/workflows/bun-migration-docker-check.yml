name: Bun Migration Docker Check

on:
  # deps-auto-update.yml starts this on its branch too: its pull_request runs
  # wait for approval, and a dependency update can break the image or node-pty.
  workflow_dispatch:
    inputs:
      railpack-frontend:
        description: "Railpack frontend for the sample app build, e.g. a version existing applications keep (empty: the image's Railpack version)"
        type: string
        default: ""
  pull_request:
    branches: [AgentHits-Dev]
    paths:
      - ".github/workflows/bun-migration-docker-check.yml"
      - ".github/scripts/trivy-image-scan.sh"
      - ".trivyignore.yaml"
      - "Dockerfile"
      - "Dockerfile.cloud"
      - "Dockerfile.server"
      - "Dockerfile.schedule"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      # Tests and docs never reach an image; rebuilding all four images for
      # them only delays the PR by ~6 minutes. Negations must come last.
      - "!apps/dokploy/__test__/**"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  main-image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare production env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> .env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> apps/dokploy/.env.production

      - name: Build main image for smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: dokploy-bun-check:main
          build-args: |
            DOKPLOY_OFFICIAL_VERSION=ci-bun-check
            DOKPLOY_FORK_VERSION=ci-bun-check

      - name: Smoke main image
        run: |
          docker run --rm --entrypoint bun dokploy-bun-check:main --version
          docker run --rm --entrypoint sh dokploy-bun-check:main -lc '
            test -f /app/packages/server/dist/index.js
            test ! -e /app/node_modules/sharp
            test ! -e /app/node_modules/@img
            node --input-type=module -e "console.log(await import.meta.resolve(\"@dokploy/server\"))"
          '
          # The panel calls these at runtime; the image installs them without
          # apt recommends and without the Docker engine.
          docker run --rm --entrypoint sh dokploy-bun-check:main -ec '
            docker --version
            docker buildx version
            docker compose version
            rclone version | head -n 1
            railpack --version
            pack --version
            nixpacks --version
            git lfs version
            ssh -V
            for tool in ssh-keyscan pkill htpasswd rsync jq zip unzip ip tini; do command -v "$tool"; done
          '
          # The panel's server runs on Bun and takes its terminals from Bun.spawn's
          # own PTY (server/wss/pty.ts); the same command must pass through it here.
          docker run --rm --entrypoint bun dokploy-bun-check:main -e '
            setTimeout(() => {
              console.error("Bun PTY: no exit in 30 s");
              process.exit(1);
            }, 30000);
            const command = "echo first; sleep 1; read -r line; echo got $line; exit 7";
            let output = "";
            const decoder = new TextDecoder();
            const proc = Bun.spawn(["/bin/sh", "-c", command], {
              terminal: { cols: 80, rows: 30, data(_terminal, data) { output += decoder.decode(data, { stream: true }); } },
            });
            proc.terminal.write("ping\n");
            const exitCode = await proc.exited;
            proc.terminal.close();
            console.log(`Bun PTY: exit ${exitCode}, output ${JSON.stringify(output)}`);
            process.exit(exitCode === 7 && output.includes("first") && output.includes("got ping") ? 0 : 1);
          '
          # node-pty serves the panel when it runs on Node (development, and the
          # Node command the Dockerfile keeps for going back). The image compiles it
          # and the tests mock it, so only this runs it: as an ESM import from /app.
          # The sleep and read fail a child that dies after its first output, as
          # node-pty's does under Bun.
          docker run --rm --entrypoint node dokploy-bun-check:main --input-type=module -e '
            import { spawn } from "node-pty";
            setTimeout(() => {
              console.error("node-pty: no exit in 30 s");
              process.exit(1);
            }, 30000);
            const command = "echo first; sleep 1; read -r line; echo got $line; exit 7";
            const pty = spawn("/bin/sh", ["-c", command], { name: "xterm-256color", cols: 80, rows: 30 });
            let output = "";
            pty.onData((data) => {
              output += data;
            });
            pty.onExit(({ exitCode }) => {
              console.log(`node-pty: exit ${exitCode}, output ${JSON.stringify(output)}`);
              process.exit(exitCode === 7 && output.includes("first") && output.includes("got ping") ? 0 : 1);
            });
            pty.write("ping\n");
          '

      # The panel's server runs on Bun. This starts the image as it ships, with
      # Postgres and a swarm, and fails unless the server answers, its process
      # is bun, and undici is the npm package there: Bun's built-in undici
      # ignores `dispatcher`, which skipped the address checks of outbound
      # requests (utils/undici.ts).
      - name: Start the panel on Bun
        run: |
          docker swarm init >/dev/null 2>&1 || true
          docker network create bun-smoke >/dev/null
          docker run -d --name bun-smoke-pg --network bun-smoke \
            -e POSTGRES_USER=dokploy -e POSTGRES_DB=dokploy -e POSTGRES_PASSWORD=smoke-postgres-password \
            postgres:18-alpine >/dev/null
          docker run -d --name bun-smoke-panel --network bun-smoke \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e POSTGRES_HOST=bun-smoke-pg -e POSTGRES_PASSWORD=smoke-postgres-password \
            -e BETTER_AUTH_SECRET=smoke-better-auth-secret-0123456789abcdef \
            -e ADVERTISE_ADDR=127.0.0.1 -e SCHEDULES_SIGNING_KEY=smoke-schedules-key \
            -e DEPLOYMENTS_SIGNING_KEY=smoke-deployments-key \
            dokploy-bun-check:main >/dev/null
          up=0
          for _ in $(seq 1 120); do
            if docker exec bun-smoke-panel curl -fs -o /dev/null http://127.0.0.1:3000/api/trpc/settings.health; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then docker logs bun-smoke-panel 2>&1 | tail -60; exit 1; fi
          # tini and sh carry the same words in their arguments, so the server
          # is the process whose executable is bun.
          docker exec bun-smoke-panel ps -eo comm=,args= | tee /dev/stderr | awk '$1 == "bun" && /dist\/server\.mjs/ { found = 1 } $1 == "node" && /dist\/server\.mjs/ { exit 1 } END { exit !found }'
          docker exec -w /app bun-smoke-panel bun -e '
            const { Agent, fetch } = await import("/app/packages/server/dist/utils/undici.js");
            const http = require("node:http");
            const server = http.createServer((req, res) => res.end(req.headers.host));
            await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
            const agent = new Agent({ connect: { lookup: (_h, o, cb) => (o.all ? cb(null, [{ address: "127.0.0.1", family: 4 }]) : cb(null, "127.0.0.1", 4)) } });
            const res = await fetch(`http://pinned.invalid:${server.address().port}/`, { dispatcher: agent });
            console.log(`undici on Bun: ${res.status} ${await res.text()}`);
            await agent.close();
            server.close();
            process.exit(res.status === 200 ? 0 : 1);
          '
          docker rm -f bun-smoke-panel bun-smoke-pg >/dev/null
          docker network rm bun-smoke >/dev/null

      # Repeats the panel's Railpack path (railpack prepare, then buildx with the
      # Railpack frontend on a docker-container builder) from inside the image,
      # so a Railpack bump that cannot build a plain Node app fails here.
      - name: Build a sample app with Railpack
        env:
          RAILPACK_FRONTEND: ${{ inputs.railpack-frontend }}
        run: |
          app="$RUNNER_TEMP/railpack-app"
          mkdir -p "$app"
          printf '%s\n' '{"name":"railpack-smoke","private":true,"scripts":{"start":"node index.js"}}' > "$app/package.json"
          printf '%s\n' 'require("node:http").createServer((_, res) => res.end("railpack-ok")).listen(process.env.PORT || 3000);' > "$app/index.js"
          frontend="${RAILPACK_FRONTEND:-$(docker run --rm --entrypoint railpack dokploy-bun-check:main --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)}"
          echo "Railpack frontend: $frontend"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$app:/src" -e FRONTEND="$frontend" --entrypoint sh dokploy-bun-check:main -ec '
            # The image carries the mise Railpack pins; a download here means
            # MISE_VERSION in the Dockerfile no longer matches Railpack. A
            # verbose plan asks the build for a MISE_VERBOSE secret, so the
            # plan that is built comes from a plain run.
            railpack --verbose prepare /src --plan-out /tmp/verbose-plan.json > /tmp/prepare.log 2>&1 || { cat /tmp/prepare.log; exit 1; }
            grep -q "Mise executable exists" /tmp/prepare.log || { cat /tmp/prepare.log; exit 1; }
            railpack prepare /src --plan-out /src/railpack-plan.json --info-out /src/railpack-info.json
            docker buildx create --name railpack-smoke --driver docker-container
            docker buildx build --builder railpack-smoke --build-arg "BUILDKIT_SYNTAX=ghcr.io/railwayapp/railpack-frontend:v$FRONTEND" -f /src/railpack-plan.json --output type=docker,name=railpack-smoke /src
            docker buildx rm railpack-smoke
          '
          docker run -d --name railpack-smoke -e PORT=3000 -p 127.0.0.1:3999:3000 railpack-smoke
          for _ in $(seq 1 30); do
            if [ "$(curl -fs http://127.0.0.1:3999 || true)" = railpack-ok ]; then exit 0; fi
            sleep 1
          done
          docker logs railpack-smoke
          exit 1

      # Same scan as image-audit.yml, on the image this PR builds.
      - name: Scan main image
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: .github/scripts/trivy-image-scan.sh dokploy-bun-check:main --image-src docker

  service-image-builds:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloud
            file: ./Dockerfile.cloud
          - name: server
            file: ./Dockerfile.server
          - name: schedule
            file: ./Dockerfile.schedule
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare production env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> .env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> apps/dokploy/.env.production

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: dokploy-bun-check:${{ matrix.name }}

      - name: Smoke ${{ matrix.name }} image
        run: |
          docker run --rm --entrypoint bun dokploy-bun-check:${{ matrix.name }} --version
          docker run --rm --entrypoint sh dokploy-bun-check:${{ matrix.name }} -lc '
            test -f /app/packages/server/dist/index.js
            node --input-type=module -e "console.log(await import.meta.resolve(\"@dokploy/server\"))"
          '
