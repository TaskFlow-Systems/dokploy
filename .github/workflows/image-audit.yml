name: Image audit

# bun audit sees only the npm dependencies. This scan reads the published panel
# image: its Debian packages, the Go binaries of the bundled tools (Docker CLI,
# rclone, Railpack, pack) and the npm packages inside it. Every day it also
# reads the pinned Traefik, Postgres and Redis images that run next to the
# panel and on servers. It fails on critical and high findings that already
# have a fix; .trivyignore.yaml lists the ones still waiting for a release.
# The findings go to the job summary. GitHub notifies the person who last
# changed the cron line when a scheduled run fails.
# A fix in a Debian package needs only a new build, since the base stage takes
# every Debian update of the day, so the daily run of the published image
# starts one. A fix in a bundled tool needs a new pin, which
# pins-auto-update.yml proposes.
on:
  schedule:
    - cron: "53 5 * * *"
  # Each push to AgentHits-Dev builds agenthits-dev-<sha12> in the release
  # workflow; the panel job scans that build once it is pushed.
  workflow_run:
    workflows: [AgentHits Release, AgentHits Dokploy Image]
    types: [completed]
    branches: [AgentHits-Dev]
  workflow_dispatch:
    inputs:
      image:
        description: Panel image to scan
        type: string
        default: ghcr.io/agenthits/dokploy:agenthits-dev

permissions:
  contents: read

env:
  # Pinned by digest: in March 2026 Trivy releases, its images and the
  # trivy-action tags were replaced with credential stealers (GHSA-69fq-xp46-6x23).
  # bun-migration-docker-check.yml pins the same image.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  panel:
    name: image audit (panel)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan image
        id: scan
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="${INPUT_IMAGE:-ghcr.io/agenthits/dokploy:agenthits-dev}"
          if [ -n "$BUILT_SHA" ]; then
            image="ghcr.io/agenthits/dokploy:agenthits-dev-${BUILT_SHA:0:12}"
          fi
          .github/scripts/trivy-image-scan.sh "$image" \
            --image-src remote --platform linux/amd64
      # Only the scheduled scan: a build that still has the finding right after
      # it was made would start the next build in a loop. The build skips the
      # layer cache: with it, apt layers come from the cache and keep the old
      # packages, so the rebuild would push the same image.
      - name: Rebuild for Debian fixes
        if: failure() && github.event_name == 'schedule' && steps.scan.outputs.os-fixable > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agenthits-image.yml --repo "$GITHUB_REPOSITORY" --ref AgentHits-Dev -f no-cache=true
          echo "Debian packages with a fix: ${{ steps.scan.outputs.os-fixable }}; started a build of AgentHits-Dev." >> "$GITHUB_STEP_SUMMARY"

  pinned:
    name: image audit (${{ matrix.name }})
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The image is the default of <NAME>_IMAGE in install-agenthits.sh, which
        # component-versions-sync.test.ts keeps equal to PINNED_VERSIONS.
        include:
          - name: traefik
          - name: postgres
            # gosu only switches to the postgres user when the container
            # starts. The Postgres 18.6 image, rebuilt on 2026-10-31, still ships gosu
            # 1.19, built with Go 1.24.6; its 26 Go stdlib advisories would
            # each need an entry in .trivyignore.yaml. gosu 1.20 came out on
            # 2026-10-25, so the skip ends with the date below and the scan
            # reports gosu again.
            skip-files: usr/local/bin/gosu
            skip-until: "2026-11-27"
          - name: redis
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan image
        env:
          NAME: ${{ matrix.name }}
          SKIP_FILES: ${{ matrix.skip-files }}
          SKIP_UNTIL: ${{ matrix.skip-until }}
        run: |
          var="$(tr '[:lower:]' '[:upper:]' <<<"$NAME")_IMAGE"
          IMAGE="$(sed -n "s/^${var}=\"\\\${${var}:-\([^}]*\)}\"\$/\1/p" install-agenthits.sh)"
          if [ -z "$IMAGE" ]; then
            echo "::error::no default for $var in install-agenthits.sh"
            exit 1
          fi
          skip=()
          if [ -n "$SKIP_FILES" ] && [[ "$(date -u +%F)" < "$SKIP_UNTIL" ]]; then
            skip=(--skip-files "$SKIP_FILES")
          fi
          .github/scripts/trivy-image-scan.sh "$IMAGE" \
            --image-src remote --platform linux/amd64 "${skip[@]}"
