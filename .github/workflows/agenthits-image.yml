name: AgentHits Dokploy Image

# Pushes to AgentHits-Dev build through agenthits-release.yml, which calls this
# workflow with a release tag when the push completes a batch and without one
# otherwise. A manual run builds the selected branch, or,
# with release-tag set to a published release, rebuilds that release's image.
on:
  workflow_call:
    inputs:
      release-tag:
        description: agenthits-vX.Y.Z tag the calling workflow publishes for this commit
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing agenthits-vX.Y.Z tag to rebuild (empty: dev build of the selected branch)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

# Cancel superseded manual builds. The workflow name keeps release builds, which
# agenthits-release.yml already runs one at a time, out of this group.
concurrency:
  group: agenthits-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: agenthits/dokploy
  STABLE_TAG: agenthits-dev

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out published release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            exit 0
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^agenthits-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release-tag must look like agenthits-vX.Y.Z, got '${RELEASE_TAG}'"
            exit 1
          fi
          # The release workflow creates its tag only after this image is
          # pushed, so an existing tag means a rebuild of an older release:
          # build that commit and leave agenthits-dev on the branch tip.
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git checkout -q --detach "refs/tags/${RELEASE_TAG}"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare production env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> .env.production
          echo "POSTGRES_PASSWORD=build-time-postgres-password" >> apps/dokploy/.env.production

      - name: Set image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          REBUILD: ${{ steps.release.outputs.rebuild }}
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          OFFICIAL_VERSION="$(node -p "require('./apps/dokploy/package.json').version")"
          if [ -n "$RELEASE_TAG" ]; then
            FORK_VERSION="$RELEASE_TAG"
          else
            FORK_VERSION="$(git describe --tags --match 'agenthits-v*' --abbrev=12 2>/dev/null || echo "${STABLE_TAG}-${SHORT_SHA}")"
          fi
          {
            echo "tags<<EOF"
            if [ "$REBUILD" != true ]; then
              echo "${IMAGE}:${STABLE_TAG}"
              echo "${IMAGE}:${STABLE_TAG}-${SHORT_SHA}"
            fi
            if [ -n "$RELEASE_TAG" ]; then
              echo "${IMAGE}:${RELEASE_TAG}"
            fi
            echo "EOF"
            echo "cache=${IMAGE}:buildcache"
            echo "official-version=${OFFICIAL_VERSION}"
            echo "fork-version=${FORK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # The image package belongs to the agentHits account, and a
          # personal-account package cannot give Actions access to a
          # repository of an organization, so GHCR refuses the job token here
          # and the push needs a token of the package owner.
          username: ${{ secrets.GHCR_PUSH_TOKEN && 'agentHits' || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          outputs: type=registry,compression=zstd,compression-level=3
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max,compression=zstd,compression-level=3
          provenance: false
          sbom: false
          build-args: |
            DOKPLOY_OFFICIAL_VERSION=${{ steps.tags.outputs.official-version }}
            DOKPLOY_FORK_VERSION=${{ steps.tags.outputs.fork-version }}
