name: AgentHits Monitoring Image

# Builds Dockerfile.monitoring for linux/amd64 and linux/arm64 and publishes
# ghcr.io/agenthits/dokploy-monitoring, which the panel runs as the
# dokploy-monitoring service on servers and on its own host
# (monitoring-setup.ts). A push to AgentHits-Dev moves agenthits-dev and adds
# agenthits-dev-<sha12>; a manual run on another branch adds only the sha tag.
# A pull request builds both platforms and scans the amd64 image without
# pushing anything.
on:
  push:
    branches: [AgentHits-Dev]
    paths:
      - "apps/monitoring/**"
      - "Dockerfile.monitoring"
      - ".github/workflows/agenthits-monitoring-image.yml"
  pull_request:
    branches: [AgentHits-Dev]
    paths:
      - "apps/monitoring/**"
      - "Dockerfile.monitoring"
      - ".github/workflows/agenthits-monitoring-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenthits-monitoring-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/agenthits/dokploy-monitoring
  # Pinned by digest, the same image as image-audit.yml.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Native runners: the program links SQLite through cgo, which is slow to
    # build under QEMU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # The package belongs to the agentHits account, like the panel image
          # (agenthits-image.yml), so the push needs that account's token.
          username: agentHits
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile.monitoring
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,name=dokploy-monitoring:check' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=monitoring-${{ matrix.arch }}
          cache-to: type=gha,scope=monitoring-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Scan image
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        run: .github/scripts/trivy-image-scan.sh dokploy-monitoring:check --image-src docker

      - name: Save digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: monitoring-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: monitoring-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: agentHits
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "${IMAGE}:agenthits-dev-${GITHUB_SHA:0:12}")
          if [ "$GITHUB_REF" = refs/heads/AgentHits-Dev ]; then
            tags+=(-t "${IMAGE}:agenthits-dev")
          fi
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:agenthits-dev-${GITHUB_SHA:0:12}"

  scan:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No login here: servers pull the image without credentials, and GHCR
      # makes a new package private until its owner makes it public.
      - name: Check the image is public
        run: |
          image="${IMAGE}:agenthits-dev-${GITHUB_SHA:0:12}"
          if ! docker buildx imagetools inspect "$image" >/dev/null; then
            echo "::error::${image} cannot be pulled without a login. Make the dokploy-monitoring package public in the agentHits account's package settings (Change visibility), then re-run this job."
            exit 1
          fi

      - name: Scan image
        run: |
          .github/scripts/trivy-image-scan.sh "${IMAGE}:agenthits-dev-${GITHUB_SHA:0:12}" \
            --image-src remote --platform linux/amd64
