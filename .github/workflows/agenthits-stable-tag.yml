name: AgentHits Stable Tag

# Panels update from agenthits-stable, so it must name a published release and
# nothing else. The tag is a carbon copy of the release's manifest: the digest
# stays the same and nothing is rebuilt. A manual run with an older release
# moves the update channel back to it.
on:
  workflow_call:
    inputs:
      release-tag:
        description: Published agenthits-vX.Y.Z release to point agenthits-stable at
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Published agenthits-vX.Y.Z release to point agenthits-stable at (empty: the latest release)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: agenthits-stable-tag
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/agenthits/dokploy
  STABLE_TAG: agenthits-stable

jobs:
  move-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^agenthits-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release-tag must look like agenthits-vX.Y.Z, got '${RELEASE_TAG}'"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            echo "::error::${RELEASE_TAG} is not a published GitHub release"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_TOKEN && 'agentHits' || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Point agenthits-stable at the release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:${STABLE_TAG}" "${IMAGE}:${RELEASE_TAG}"
          docker buildx imagetools inspect --raw "${IMAGE}:${RELEASE_TAG}" > release.json
          docker buildx imagetools inspect --raw "${IMAGE}:${STABLE_TAG}" > stable.json
          if ! cmp -s release.json stable.json; then
            echo "::error::${STABLE_TAG} does not carry the manifest of ${RELEASE_TAG}"
            exit 1
          fi
          echo "${STABLE_TAG} now points at ${RELEASE_TAG} (sha256:$(sha256sum < release.json | cut -d' ' -f1))"
